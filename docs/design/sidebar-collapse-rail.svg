<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui" font-size="13">
  <defs>
    <style>
      .fg{fill:var(--fg)} .muted{fill:var(--muted)} .border{stroke:var(--border);fill:none}
      .surface{fill:var(--surface)} .accent{fill:var(--accent)}
      .lbl{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.5px}
      .name{font-size:12.5px;fill:var(--fg)}
      .proj{font-size:12px;fill:var(--muted);font-weight:600}
      .cap{font-size:12px;fill:var(--muted)}
      .h{font-size:13px;fill:var(--fg);font-weight:650}
    </style>
  </defs>

  <!-- 1. Expanded -->
  <g transform="translate(10,0)">
    <text x="0" y="18" class="h">1. 展开 Expanded</text>
    <rect x="0" y="32" width="180" height="360" rx="8" class="surface"/>
    <rect x="0.5" y="32.5" width="179" height="359" rx="8" class="border"/>
    <rect x="14" y="46" width="16" height="14" rx="3" class="border"/>
    <rect x="36" y="46" width="16" height="14" rx="3" class="border"/>
    <text x="150" y="58" class="lbl">268px</text>
    <line x1="0" y1="74" x2="180" y2="74" class="border"/>
    <text x="16" y="98" class="proj">&#9662; kero</text>
    <rect x="8" y="108" width="164" height="30" rx="7" class="accent" opacity="0.14"/>
    <rect x="8" y="108" width="164" height="30" rx="7" class="border" stroke="var(--accent)" opacity="0.5"/>
    <rect x="18" y="117" width="12" height="12" rx="3" class="accent"/>
    <text x="40" y="128" class="name">api-server</text>
    <circle cx="160" cy="123" r="4" fill="var(--success)"/>
    <rect x="18" y="149" width="12" height="12" rx="3" class="border"/>
    <text x="40" y="160" class="name">worker</text>
    <circle cx="160" cy="155" r="4" fill="var(--warning)"/>
    <rect x="18" y="181" width="12" height="12" rx="3" class="border"/>
    <text x="40" y="192" class="name">migrate-db</text>
    <circle cx="160" cy="187" r="4" fill="var(--muted)"/>
    <text x="16" y="226" class="proj">&#9656; website</text>
    <text x="16" y="254" class="proj">&#9656; scripts</text>
  </g>

  <g transform="translate(200,200)"><text x="0" y="0" class="cap">折叠 &#8594;</text></g>

  <!-- 2. Rail (default collapsed) -->
  <g transform="translate(280,0)">
    <text x="0" y="18" class="h">2. 图标栏 Rail（默认折叠态）</text>
    <rect x="0" y="32" width="64" height="360" rx="8" class="surface"/>
    <rect x="0.5" y="32.5" width="63" height="359" rx="8" class="border"/>
    <text x="6" y="58" class="lbl">64px</text>
    <line x1="0" y1="74" x2="64" y2="74" class="border"/>
    <g transform="translate(0,88)">
      <rect x="6" y="0" width="52" height="30" rx="8" class="accent" opacity="0.14"/>
      <rect x="6.5" y="0.5" width="51" height="29" rx="8" class="border" stroke="var(--accent)" opacity="0.5"/>
      <rect x="15" y="7" width="14" height="14" rx="4" class="accent"/>
      <text x="18" y="19" class="name" style="font-size:11px">K</text>
    </g>
    <circle cx="22" cy="130" r="4" fill="var(--success)"/>
    <circle cx="42" cy="130" r="4" fill="var(--warning)"/>
    <circle cx="32" cy="146" r="4" fill="var(--muted)"/>
    <line x1="14" y1="166" x2="50" y2="166" class="border"/>
    <g transform="translate(0,182)">
      <rect x="15" y="7" width="14" height="14" rx="4" class="border"/>
      <text x="18" y="19" class="name" style="font-size:11px">W</text>
    </g>
    <g transform="translate(0,222)">
      <rect x="15" y="7" width="14" height="14" rx="4" class="border"/>
      <text x="18" y="19" class="name" style="font-size:11px">S</text>
    </g>
    <g transform="translate(0,344)">
      <rect x="18" y="0" width="28" height="28" rx="7" class="border"/>
      <rect x="25" y="13" width="14" height="2" rx="1" class="fg"/>
      <rect x="31" y="7" width="2" height="14" rx="1" class="fg"/>
    </g>
  </g>

  <g transform="translate(360,200)"><text x="0" y="0" class="cap">&#8984;B / zen &#8594;</text></g>

  <!-- 3. Hidden -->
  <g transform="translate(470,0)">
    <text x="0" y="18" class="h">3. 隐藏 Hidden</text>
    <rect x="0" y="32" width="180" height="360" rx="8" class="surface"/>
    <rect x="0.5" y="32.5" width="179" height="359" rx="8" class="border"/>
    <rect x="14" y="46" width="16" height="14" rx="3" class="border"/>
    <text x="120" y="58" class="lbl">0px</text>
    <line x1="0" y1="74" x2="180" y2="74" class="border"/>
    <text x="20" y="120" class="name">编辑器占满整宽</text>
    <text x="20" y="142" class="cap">会话入口只在 pane header</text>
    <text x="20" y="160" class="cap">的 show-sidebar 按钮</text>
    <text x="20" y="186" class="cap">（当前 Kero 两态折叠</text>
    <text x="20" y="204" class="cap">缺中间的 Rail 档）</text>
  </g>

  <text x="10" y="410" class="cap">切换：Expanded &#8646; Rail 走 toggle；Rail &#8646; Hidden 走 &#8984;B / zen。Rail 始终保留导航。</text>
</svg>
