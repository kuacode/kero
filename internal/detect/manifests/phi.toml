id = "phi"
version = "2026.11.26.1"
min_engine_version = 1
updated_at = "2026-11-26T00:00:00Z"

[[rules]]
id = "approval_blocked"
state = "blocked"
priority = 200
region = "bottom_non_empty_lines(12)"
visible_blocker = true
contains = ["Waiting for approval…"]

[[rules]]
id = "working_activity"
state = "working"
priority = 120
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  # One of the status label's texts; each holds alone, as `contains`
  # is an AND within a gate.
  { contains = ["Sending…"] },
  { contains = ["Awaiting reply…"] },
  { contains = ["Generating…"] },
  { contains = ["Auto-compacting…"] },
  { contains = ["Retrying after disconnect…"] },
  { line_regex = ['Calling (?:tools|\d+ tools)…'] },
  # A tool or thinking row mid-run turns a braille spinner; finished ones
  # show a check.  The spinner is what survives a label truncated narrow.
  { line_regex = ['^\s*[\x{2800}-\x{28FF}]\s+(Thinking|read|write|edit|bash|grep|find|ls)\b'] },
]
